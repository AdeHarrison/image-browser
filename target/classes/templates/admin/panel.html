<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .admin-box { max-width: 560px; margin: 3rem auto; padding: 2rem;
                     border: 1px solid #ddd; border-radius: 8px; }
        .admin-box h2 { margin-top: 0; }
        .admin-box p  { color: #555; line-height: 1.6; }
        .btn-reload   { padding: 0.7rem 1.4rem; background: #0066cc; color: white;
                        border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        .btn-reload:hover   { background: #0052a3; }
        .btn-logout   { padding: 0.5rem 1rem; background: #888; color: white;
                        border: none; border-radius: 4px; cursor: pointer; margin-top: 2rem; }
        .btn-logout:hover   { background: #666; }
        #reload-status .success { color: green; font-weight: bold; }
        #reload-status .error   { color: red; }
        .spinner { display: none; margin-left: 0.5rem; }
        .htmx-request .spinner { display: inline; }
        hr { margin: 2rem 0; border: none; border-top: 1px solid #eee; }
    </style>
</head>
<body>
<div class="admin-box">
    <h2>⚙️ Admin Panel</h2>

    <p>
        Use <strong>Reload from Spreadsheet</strong> when the spreadsheet's
        <em>Metadata → A1</em> cell has been updated with a new timestamp.
        This clears all existing images and reimports from scratch.
    </p>

    <button class="btn-reload"
            hx-post="/admin/reload"
            hx-target="#reload-status"
            hx-indicator=".spinner">
        ↺ Reload from Spreadsheet
    </button>
    <span class="spinner htmx-indicator">⏳ Reloading...</span>

    <div id="reload-status"></div>

    <hr>

    <form action="/admin/logout" method="post">
        <button type="submit" class="btn-logout">Logout</button>
    </form>

    <a href="/" style="display:block; margin-top:1rem; color:#666;">
        ← Back to image browser
    </a>
</div>
</body>
</html>
