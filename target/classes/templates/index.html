<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Image Browser</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<header>
    <h1>📷 Community Image Browser</h1>
    <span class="total-count" th:text="'(' + ${totalImages} + ' images)'"></span>
    <a href="/admin/login" class="admin-link">Admin</a>
</header>

<main>
    <!-- Search bar -->
    <div class="search-bar">
        <input id="search-input"
               type="search"
               name="q"
               placeholder="Search images..."
               autocomplete="off"
               hx-get="/search"
               hx-trigger="keyup changed delay:300ms, search"
               hx-target="#grid"
               hx-indicator="#search-spinner"
               autofocus>
        <span id="search-spinner" class="htmx-indicator spinner">⏳</span>
    </div>

    <!-- Thumbnail grid -->
    <div id="grid"
         class="image-grid"
         hx-get="/search?q="
         hx-trigger="load">
        <p class="loading">Loading images...</p>
    </div>

    <!-- Full image viewer — populated by HTMX on card click -->
    <div id="viewer-container"></div>
</main>

<!-- Modal backdrop -->
<div id="modal-backdrop" onclick="closeModal()">
    <div id="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
        <div id="modal-content">
            <!-- HTMX loads content here -->
        </div>
    </div>
</div>

<link rel="stylesheet" th:href="@{/css/main.css}">
<script th:src="@{/js/app.js}"></script>

</body>
</html>
