<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <style>
        .login-box { max-width: 320px; margin: 5rem auto; padding: 2rem;
                     border: 1px solid #ddd; border-radius: 8px; }
        .login-box h2 { margin-top: 0; }
        .login-box input { width: 100%; padding: 0.5rem; font-size: 1rem;
                           margin: 0.4rem 0 1rem; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 0.6rem; background: #0066cc;
                            color: white; border: none; border-radius: 4px;
                            font-size: 1rem; cursor: pointer; }
        .login-box button:hover { background: #0052a3; }
        .back-link { display: block; text-align: center; margin-top: 1rem;
                     color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>🔐 Admin Login</h2>
    <label for="pwd">Password</label>
    <input type="password" id="pwd" name="password"
           placeholder="Enter admin password"
           hx-post="/admin/login"
           hx-trigger="keyup[key=='Enter']"
           hx-target="#login-result">

    <button hx-post="/admin/login"
            hx-include="#pwd"
            hx-target="#login-result">
        Login
    </button>

    <div id="login-result"></div>
    <a class="back-link" href="/">← Back to image browser</a>
</div>
</body>
</html>
