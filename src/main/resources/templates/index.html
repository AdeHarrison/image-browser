<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Image Browser</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<header>
    <h1>📷 Community Image Browser</h1>
    <span class="total-count" th:text="'(' + ${totalImages} + ' images)'"></span>
    <!-- TEMPORARY: skips the login page while admin auth is disabled for testing; restore href="/admin/login" before real deployment -->
    <a href="/admin" class="admin-link">Admin</a>
</header>

<main>
    <!-- Search bar -->
    <div class="search-bar">
        <input id="search-input"
               type="search"
               name="q"
               placeholder="Search images... (min 3 characters)"
               autocomplete="off"
               minlength="3"
               hx-get="/search"
               hx-trigger="keyup changed delay:300ms[target.value.length >= 3], search[target.value.length >= 3]"
               hx-target="#grid"
               hx-indicator="#search-spinner"
               oninput="if(this.value.length < 3) document.getElementById('grid').innerHTML = '<p class=&quot;loading&quot;>Type at least 3 characters to search…</p>'"
               autofocus>
        <span id="search-spinner" class="htmx-indicator spinner">⏳</span>
    </div>

    <!-- Thumbnail grid -->
    <div id="grid" class="image-grid">
        <p class="loading">Type at least 3 characters to search…</p>
    </div>
</main>

<script>
    // Guard against a stale in-flight /search response (fired while >=3 chars were
    // present) swapping in after the user has since deleted back below 3 chars.
    document.body.addEventListener('htmx:beforeSwap', function (evt) {
        if (evt.target.id === 'grid' && document.getElementById('search-input').value.length < 3) {
            evt.detail.shouldSwap = false;
        }
    });
</script>

</body>
</html>
