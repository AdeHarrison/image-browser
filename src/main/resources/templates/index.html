<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Image Browser</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<header>
    <h1>📷 Community Image Browser</h1>
    <span class="total-count" th:text="'(' + ${totalImages} + ' images)'"></span>
    <!-- TEMPORARY: skips the login page while admin auth is disabled for testing; restore href="/admin/login" before real deployment -->
    <a href="/admin" class="admin-link">Admin</a>
</header>

<main>
    <!-- Search bar -->
    <div class="search-bar">
        <input id="search-input"
               type="search"
               name="q"
               placeholder="Search images... (min 3 characters, or * to browse all)"
               autocomplete="off"
               hx-get="/search"
               hx-trigger="keyup changed delay:300ms[target.value.length >= 3 || target.value === '*'], search[target.value.length >= 3 || target.value === '*']"
               hx-target="#grid"
               hx-indicator="#search-spinner"
               oninput="if(this.value.length < 3 && this.value !== '*') { document.getElementById('grid').innerHTML = '<p class=&quot;loading&quot;>Type at least 3 characters to search…</p>'; document.getElementById('browse-nav').innerHTML = ''; }"
               autofocus>
        <span id="search-spinner" class="htmx-indicator spinner">⏳</span>
    </div>

    <!-- Thumbnail grid -->
    <div id="grid" class="image-grid">
        <p class="loading">Type at least 3 characters to search…</p>
    </div>

    <!-- Browse-all (*) pagination, filled via an out-of-band swap from /search or /browse -->
    <div id="browse-nav" class="browse-nav"></div>
</main>

<!-- Thumbnail description tooltip -->
<div id="thumb-tooltip" class="thumb-tooltip"></div>

<!-- Full image viewer -->
<div id="modal-backdrop">
    <div id="modal" class="image-modal">
        <button type="button" class="modal-close" aria-label="Close">&times;</button>
        <img id="modal-image" class="full-image" src="" alt="">
        <p id="modal-description" class="image-caption"></p>
        <div class="nav-bar">
            <button type="button" id="nav-first">First</button>
            <button type="button" id="nav-prev">Previous</button>
            <span id="nav-label" class="nav-label"></span>
            <button type="button" id="nav-next">Next</button>
            <button type="button" id="nav-last">Last</button>
        </div>
    </div>
</div>

<script>
    var searchInput = document.getElementById('search-input');

    // How many thumbnails fit on screen without vertical scrolling, leaving room
    // for the first/previous/next/last bar below the grid.
    function computeBrowsePageSize() {
        var grid = document.getElementById('grid');
        var nav  = document.getElementById('browse-nav');
        var gap  = 10; // matches .image-grid's gap

        var sample   = grid.querySelector('.card');
        var cardBox  = sample ? sample.getBoundingClientRect() : { width: 152, height: 184 };

        var availableWidth  = grid.clientWidth;
        var availableHeight = window.innerHeight - grid.getBoundingClientRect().top
                - (nav.offsetHeight || 90) - 16;

        var columns = Math.max(1, Math.floor(availableWidth  / (cardBox.width  + gap)));
        var rows    = Math.max(1, Math.floor(availableHeight / (cardBox.height + gap)));

        return columns * rows;
    }

    // "*" is a request to browse every image instead of searching by text —
    // reroute the debounced htmx request from /search to /browse, sized to fill
    // the visible area without a vertical scrollbar.
    document.body.addEventListener('htmx:configRequest', function (evt) {
        if (evt.detail.elt === searchInput && searchInput.value === '*') {
            evt.detail.path = '/browse';
            delete evt.detail.parameters.q;
            evt.detail.parameters.page = 0;
        }
        if (evt.detail.path.indexOf('/browse') === 0) {
            evt.detail.parameters.size = computeBrowsePageSize();
        }
    });

    // Re-fill the screen if the window is resized while browsing all images.
    (function () {
        var resizeTimer = null;
        window.addEventListener('resize', function () {
            if (searchInput.value !== '*') return;
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function () {
                htmx.trigger(searchInput, 'search');
            }, 250);
        });
    })();

    // Guard against a stale in-flight /search or /browse response swapping in
    // after the user has since deleted back below 3 chars (and isn't browsing all).
    document.body.addEventListener('htmx:beforeSwap', function (evt) {
        var val = searchInput.value;
        if ((evt.target.id === 'grid' || evt.target.id === 'browse-nav') && val.length < 3 && val !== '*') {
            evt.detail.shouldSwap = false;
        }
    });

    // Thumbnail description tooltip — shows 0.5s after the pointer settles on a
    // thumbnail, closes as soon as the pointer leaves it. Delegated on #grid since
    // cards are swapped in/out by htmx.
    (function () {
        var grid        = document.getElementById('grid');
        var tooltip     = document.getElementById('thumb-tooltip');
        var hoverTimer  = null;

        function positionTooltip(card) {
            var rect = card.getBoundingClientRect();
            tooltip.style.left = 'auto';
            tooltip.style.top  = 'auto';
            var left = rect.left;
            var top  = rect.bottom + 8;
            tooltip.classList.add('visible');
            var tw = tooltip.offsetWidth;
            var th = tooltip.offsetHeight;
            if (left + tw > window.innerWidth - 8)  left = window.innerWidth - tw - 8;
            if (left < 8)                           left = 8;
            if (top + th > window.innerHeight - 8)  top = rect.top - th - 8;
            tooltip.style.left = left + 'px';
            tooltip.style.top  = top + 'px';
        }

        function hideTooltip() {
            clearTimeout(hoverTimer);
            hoverTimer = null;
            tooltip.classList.remove('visible');
        }

        grid.addEventListener('mouseover', function (evt) {
            var card = evt.target.closest('.card');
            if (!card || (evt.relatedTarget && card.contains(evt.relatedTarget))) return;

            clearTimeout(hoverTimer);
            hoverTimer = setTimeout(function () {
                var description = card.getAttribute('data-description');
                if (!description) return;
                tooltip.textContent = description;
                positionTooltip(card);
            }, 500);
        });

        grid.addEventListener('mouseout', function (evt) {
            var card = evt.target.closest('.card');
            if (!card || (evt.relatedTarget && card.contains(evt.relatedTarget))) return;
            hideTooltip();
        });
    })();

    // Full image viewer — click a thumbnail to open it, navigate the current
    // search/browse result set with First/Previous/Next/Last (or Home/Left/Right/End),
    // and highlight the corresponding thumbnail behind the modal as it moves.
    (function () {
        var grid        = document.getElementById('grid');
        var backdrop     = document.getElementById('modal-backdrop');
        var modalImage   = document.getElementById('modal-image');
        var modalDesc    = document.getElementById('modal-description');
        var navLabel     = document.getElementById('nav-label');
        var navFirst     = document.getElementById('nav-first');
        var navPrev      = document.getElementById('nav-prev');
        var navNext      = document.getElementById('nav-next');
        var navLast      = document.getElementById('nav-last');
        var closeBtn     = document.querySelector('#modal-backdrop .modal-close');

        var viewerIds   = [];
        var viewerIndex = -1;
        var activeCard  = null;

        function highlight(card) {
            if (activeCard) activeCard.classList.remove('active');
            activeCard = card || null;
            if (activeCard) {
                activeCard.classList.add('active');
                activeCard.scrollIntoView({ block: 'nearest' });
            }
        }

        function showAt(index) {
            if (index < 0 || index >= viewerIds.length) return;
            viewerIndex = index;

            var id   = viewerIds[index];
            var card = grid.querySelector('.card[data-id="' + id + '"]');

            modalImage.src = '/image/' + id;
            modalImage.alt = card ? card.querySelector('img').alt : '';
            modalDesc.textContent = card ? card.getAttribute('data-description') : '';
            navLabel.textContent  = (index + 1) + ' of ' + viewerIds.length;

            navFirst.disabled = navPrev.disabled = index === 0;
            navLast.disabled  = navNext.disabled = index === viewerIds.length - 1;

            highlight(card);
        }

        function openViewer(card) {
            var cards = Array.prototype.slice.call(grid.querySelectorAll('.card[data-id]'));
            viewerIds = cards.map(function (c) { return c.getAttribute('data-id'); });

            var index = cards.indexOf(card);
            if (index === -1) return;

            backdrop.classList.add('open');
            document.addEventListener('keydown', onKeydown);
            showAt(index);
        }

        function closeViewer() {
            backdrop.classList.remove('open');
            document.removeEventListener('keydown', onKeydown);
            highlight(null);
        }

        function onKeydown(evt) {
            switch (evt.key) {
                case 'ArrowLeft':  evt.preventDefault(); showAt(viewerIndex - 1); break;
                case 'ArrowRight': evt.preventDefault(); showAt(viewerIndex + 1); break;
                case 'Home':       evt.preventDefault(); showAt(0); break;
                case 'End':        evt.preventDefault(); showAt(viewerIds.length - 1); break;
                case 'Escape':     evt.preventDefault(); closeViewer(); break;
            }
        }

        grid.addEventListener('click', function (evt) {
            var card = evt.target.closest('.card[data-id]');
            if (card) openViewer(card);
        });

        // Tab / Shift-Tab between thumbnails is native browser behavior once cards
        // are focusable (tabindex="0", set server-side); Enter opens the focused one.
        grid.addEventListener('keydown', function (evt) {
            if (evt.key !== 'Enter') return;
            var card = evt.target.closest('.card[data-id]');
            if (card) {
                evt.preventDefault();
                openViewer(card);
            }
        });

        backdrop.addEventListener('click', function (evt) {
            if (evt.target === backdrop) closeViewer();
        });
        closeBtn.addEventListener('click', closeViewer);

        navFirst.addEventListener('click', function () { showAt(0); });
        navPrev.addEventListener('click',  function () { showAt(viewerIndex - 1); });
        navNext.addEventListener('click',  function () { showAt(viewerIndex + 1); });
        navLast.addEventListener('click',  function () { showAt(viewerIds.length - 1); });
    })();
</script>

</body>
</html>
