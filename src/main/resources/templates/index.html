<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Image Browser</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>

<header>
    <h1>📷 Community Image Browser</h1>
    <span class="total-count" th:text="'(' + ${totalImages} + ' images)'"></span>
    <!-- TEMPORARY: skips the login page while admin auth is disabled for testing; restore href="/admin/login" before real deployment -->
    <a href="/admin" class="admin-link">Admin</a>
</header>

<main>
    <!-- Search bar -->
    <div class="search-bar">
        <input id="search-input"
               type="search"
               name="q"
               placeholder="Search images... (min 3 characters, or * to browse all)"
               autocomplete="off"
               hx-get="/search"
               hx-trigger="keyup changed delay:300ms[target.value.length >= 3 || target.value === '*'], search[target.value.length >= 3 || target.value === '*']"
               hx-target="#grid"
               hx-indicator="#search-spinner"
               oninput="if(this.value.length < 3 && this.value !== '*') { document.getElementById('grid').innerHTML = '<p class=&quot;loading&quot;>Type at least 3 characters to search…</p>'; document.getElementById('browse-nav').innerHTML = ''; }"
               autofocus>
        <span id="search-spinner" class="htmx-indicator spinner">⏳</span>
    </div>

    <!-- Thumbnail grid -->
    <div id="grid" class="image-grid">
        <p class="loading">Type at least 3 characters to search…</p>
    </div>

    <!-- Browse-all (*) pagination, filled via an out-of-band swap from /search or /browse -->
    <div id="browse-nav" class="browse-nav"></div>
</main>

<!-- Thumbnail description tooltip -->
<div id="thumb-tooltip" class="thumb-tooltip"></div>

<script>
    var searchInput = document.getElementById('search-input');

    // "*" is a request to browse every image instead of searching by text —
    // reroute the debounced htmx request from /search to /browse.
    document.body.addEventListener('htmx:configRequest', function (evt) {
        if (evt.detail.elt === searchInput && searchInput.value === '*') {
            evt.detail.path = '/browse';
            delete evt.detail.parameters.q;
            evt.detail.parameters.page = 0;
        }
    });

    // Guard against a stale in-flight /search or /browse response swapping in
    // after the user has since deleted back below 3 chars (and isn't browsing all).
    document.body.addEventListener('htmx:beforeSwap', function (evt) {
        var val = searchInput.value;
        if ((evt.target.id === 'grid' || evt.target.id === 'browse-nav') && val.length < 3 && val !== '*') {
            evt.detail.shouldSwap = false;
        }
    });

    // Thumbnail description tooltip — shows 0.5s after the pointer settles on a
    // thumbnail, closes as soon as the pointer leaves it. Delegated on #grid since
    // cards are swapped in/out by htmx.
    (function () {
        var grid        = document.getElementById('grid');
        var tooltip     = document.getElementById('thumb-tooltip');
        var hoverTimer  = null;

        function positionTooltip(card) {
            var rect = card.getBoundingClientRect();
            tooltip.style.left = 'auto';
            tooltip.style.top  = 'auto';
            var left = rect.left;
            var top  = rect.bottom + 8;
            tooltip.classList.add('visible');
            var tw = tooltip.offsetWidth;
            var th = tooltip.offsetHeight;
            if (left + tw > window.innerWidth - 8)  left = window.innerWidth - tw - 8;
            if (left < 8)                           left = 8;
            if (top + th > window.innerHeight - 8)  top = rect.top - th - 8;
            tooltip.style.left = left + 'px';
            tooltip.style.top  = top + 'px';
        }

        function hideTooltip() {
            clearTimeout(hoverTimer);
            hoverTimer = null;
            tooltip.classList.remove('visible');
        }

        grid.addEventListener('mouseover', function (evt) {
            var card = evt.target.closest('.card');
            if (!card || (evt.relatedTarget && card.contains(evt.relatedTarget))) return;

            clearTimeout(hoverTimer);
            hoverTimer = setTimeout(function () {
                var description = card.getAttribute('data-description');
                if (!description) return;
                tooltip.textContent = description;
                positionTooltip(card);
            }, 500);
        });

        grid.addEventListener('mouseout', function (evt) {
            var card = evt.target.closest('.card');
            if (!card || (evt.relatedTarget && card.contains(evt.relatedTarget))) return;
            hideTooltip();
        });
    })();
</script>

</body>
</html>
