spring.application.name=image-browser
server.port=7000

# SQLite datasource — commented out while PostgreSQL is being trialled (see below).
# Swap the two blocks to switch back and compare against the original process.
# spring.datasource.url=jdbc:sqlite:${app.db.path:images.db}
# spring.datasource.driver-class-name=org.sqlite.JDBC
# spring.datasource.hikari.maximum-pool-size=10
# spring.datasource.hikari.minimum-idle=2
# spring.datasource.hikari.connection-timeout=3000
# spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL; PRAGMA cache_size=-32000;

# PostgreSQL datasource (local dev — see docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/image_browser
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=15m

# Application config
app.data.dir=${APP_DATA_DIR:.}
app.spreadsheet.path=${app.data.dir}/data/input/Archive_Index_Numbers_Current.xlsx
# Bump this manually (ISO LocalDateTime) whenever the spreadsheet/images change, to trigger a reimport.
app.spreadsheet.version=2026-08-23T00:00:00 #todo add to "meta/config" sheet to original ss possibly?
app.data.output-dir=data/output
app.browse.page-size=60
app.thumbnail.max-px=128
app.thumbnail.jpeg-quality=0.75
app.cache.thumbnail-max-bytes=15728640
app.cache.fullimage-max-bytes=41943040
app.cache.expire-minutes=15
# Disabled while PostgreSQL is being trialled — the old SQLite-shaped "images"
# table doesn't exist yet, and ImageCacheService's async preload would query it
# on startup and crash (see the comment on ImageCacheService.schedulePreload()).
app.preload.enabled=false
app.preload.page-size=50
