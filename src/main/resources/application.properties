spring.application.name=image-browser
server.port=7000

# PostgreSQL datasource (local dev — see docker-compose.yml)
# No default username/password here, deliberately — set SPRING_DATASOURCE_USERNAME /
# SPRING_DATASOURCE_PASSWORD as env vars (the app-role credentials from
# scripts/create-app-role, never the Postgres admin role) before running locally.
spring.datasource.url=jdbc:postgresql://localhost:5432/image_browser
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html

# Application config
app.data.dir=${APP_DATA_DIR:.}
app.spreadsheet.filename=${APP_SPREADSHEET_FILENAME:Archive_Index_Numbers_Current.xlsx}
app.spreadsheet.path=${app.data.dir}/data/input/${app.spreadsheet.filename}
app.data.output-dir=${app.data.dir}/data/output
app.browse.page-size=60
app.thumbnail.max-px=128
app.thumbnail.jpeg-quality=0.75
