spring.application.name=image-browser
server.port=7000

# SQLite datasource
spring.datasource.url=jdbc:sqlite:${app.db.path:images.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL; PRAGMA cache_size=-32000;

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterAccess=15m

# Application config
app.spreadsheet.path=spreadsheet.xlsx
app.admin.properties=admin.properties
app.thumbnail.max-px=128
app.thumbnail.jpeg-quality=0.75
app.cache.thumbnail-max-bytes=15728640
app.cache.fullimage-max-bytes=41943040
app.cache.expire-minutes=15
app.preload.enabled=true
app.preload.page-size=50
