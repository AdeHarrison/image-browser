spring.application.name=image-browser
server.port=7000

# PostgreSQL datasource (local dev — see docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/image_browser
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.suffix=.html

# Application config
app.data.dir=${APP_DATA_DIR:.}
app.spreadsheet.path=${app.data.dir}/data/input/Archive_Index_Numbers_Current.xlsx
app.data.output-dir=${app.data.dir}/data/output
app.browse.page-size=60
app.thumbnail.max-px=128
app.thumbnail.jpeg-quality=0.75
