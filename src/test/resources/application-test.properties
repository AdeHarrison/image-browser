spring.datasource.url=jdbc:sqlite::memory:?cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL;

app.spreadsheet.path=src/test/resources/test-spreadsheet.xlsx
app.admin.properties=src/test/resources/test-admin.properties
app.thumbnail.max-px=64
app.thumbnail.jpeg-quality=0.75
app.cache.thumbnail-max-bytes=5242880
app.cache.fullimage-max-bytes=10485760
app.cache.expire-minutes=5
app.preload.enabled=false
